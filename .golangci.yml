# golangci-lint configuration: the standard linters, plus gosec, so that
# "make lint", CI and a developer's machine run the same security checks.
version: "2"

linters:
  default: standard
  enable:
    - gosec
  settings:
    gosec:
      excludes:
        # unchecked errors: errcheck reports them already, and honours the
        # //nolint:errcheck justifications in the code
        - G104
  exclusions:
    rules:
      # tests and test tooling (test/, and the fakes of packages named
      # *test, e.g. openstacktest) read their own fixtures, write temporary
      # files and use made-up credentials
      - path: (_test\.go$|^test/|/[a-z]+test/)
        linters:
          - gosec
