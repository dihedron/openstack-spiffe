# SPIRE Agent configuration fragment enabling the openstack_iid node
# attestor (merge into the plugins block of agent.conf).
#
# The agent plugin fetches the instance identity token that
# openstack-spire-issuer hands to the instance through Nova's vendordata,
# and sends it to SPIRE Server. The binary must be in the instance image
# before SPIRE Agent starts.

plugins {
  NodeAttestor "openstack_iid" {
    plugin_cmd      = "/usr/bin/openstack-agent-plugin"
    # SHA-256 of the installed binary (make checksum): SPIRE refuses to load
    # a binary whose hash does not match
    plugin_checksum = "<sha256 of the installed binary>"
    plugin_data {
      # Nova's metadata service; config drives are not supported (their
      # token is frozen at boot and expires minutes later)
      vendordata_url      = "http://169.254.169.254/openstack/latest/vendor_data2.json"
      # bounds each fetch
      http_timeout        = "5s"
      # bounds the wait for a fresh token when Nova's metadata cache still
      # serves the one presented last (Nova's default cache window is 15s)
      fresh_token_timeout = "30s"
    }
  }
}
