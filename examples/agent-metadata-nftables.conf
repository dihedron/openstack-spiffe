#!/usr/sbin/nft -f
#
# Guest hardening for instances running SPIRE Agent with the openstack_iid
# node attestor (S-4 in .specs/openstack-spire-threat-model.md).
#
# Every process in the instance can read the attestation token from the
# metadata service. This rule lets only root (cloud-init reads metadata as
# root) and the SPIRE Agent's user reach it, and rejects everyone else.
#
# It is a sample: the package never activates it. Load it at boot, before any
# untrusted workload starts, through the image's nftables service, e.g. by
# including it from /etc/nftables.conf (Debian, Ubuntu) or
# /etc/sysconfig/nftables.conf (RHEL-like). The user must exist when the rule
# is loaded: the name is resolved at load time.
#
# The rule matches the user inside the network namespace where it is loaded:
# containers must not share the instance's network namespace (no
# --network host), and container networks must not reach these addresses.

# the user SPIRE Agent runs as
define spire_agent_user = "spire"

# loading the file again replaces the table
table inet openstack_metadata
delete table inet openstack_metadata

table inet openstack_metadata {
	chain output {
		type filter hook output priority filter; policy accept;

		ip daddr 169.254.169.254 meta skuid { 0, $spire_agent_user } accept
		ip daddr 169.254.169.254 reject with icmpx admin-prohibited

		# the IPv6 metadata service, where used
		ip6 daddr fe80::a9fe:a9fe meta skuid { 0, $spire_agent_user } accept
		ip6 daddr fe80::a9fe:a9fe reject with icmpx admin-prohibited
	}
}
