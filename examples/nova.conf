# Nova settings registering openstack-spire-metadata as a DynamicJSON
# vendordata target (nova-api-metadata nodes).

[api]
vendordata_providers = StaticJSON,DynamicJSON
# the target name must be openstack_iid: the SPIRE agent plugin looks it up
vendordata_dynamic_targets = openstack_iid@https://openstack-metadata-signer.internal:8443/attest
# CA bundle to verify the signer's certificate (or its load balancer's)
vendordata_dynamic_ssl_certfile = /etc/ssl/openstack-metadata-signer-ca.pem
# the signer answers within one lookup timeout (5s): do not go below it
vendordata_dynamic_connect_timeout = 5
vendordata_dynamic_read_timeout = 5
# a failed call omits openstack_iid instead of failing the whole metadata request
vendordata_dynamic_failure_fatal = False

# Nova authenticates to the signer with this user's token (X-Auth-Token); the
# user must be in the signer's keystone.allowed_users (as name@domain or ID)
# and carry keystone.required_role (default "service").
[vendordata_dynamic_auth]
auth_type = password
auth_url = https://keystone.internal:5000/v3
username = nova
password = CHANGE_ME
user_domain_name = Default
project_name = service
project_domain_name = Default
