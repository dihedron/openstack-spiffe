# SPIRE Server configuration fragment enabling the openstack_iid node
# attestor (merge into the plugins block of server.conf). The trust domain
# comes from the server's own configuration.
#
# Agents attested this way get the SPIFFE ID
#   spiffe://<trust_domain>/spire/agent/openstack_iid/<project_id>/<instance_id>
# and the selectors openstack_iid:project_id:<id>, openstack_iid:instance_id:<id>,
# openstack_iid:hostname:<name>, openstack_iid:tag:<key>:<value> and, when the
# issuer enables them, openstack_iid:availability_zone:<az>, openstack_iid:flavor:<name>,
# openstack_iid:user_id:<id>, openstack_iid:project_name:<name> and
# openstack_iid:domain_id:<id>.

plugins {
  NodeAttestor "openstack_iid" {
    plugin_cmd      = "/usr/bin/openstack-server-plugin"
    # SHA-256 of the installed binary (make checksum)
    plugin_checksum = "<sha256 of the installed binary>"
    plugin_data {
      # the merged JWK Set: the JWKS aggregator's, or the peered signer
      # replicas' /.well-known/jwks.json (never a replica's /jwks/local.json)
      jwks_url                  = "https://openstack-metadata-jwks.internal:8444/.well-known/jwks.json"
      # CA bundle pinning the JWKS endpoint's certificate (default: system roots)
      jwks_ca_cert_path         = "/etc/ssl/openstack-metadata-ca.pem"
      tls_min_version           = "1.3"
      jwks_refresh_interval     = "30s"
      jwks_fetch_timeout        = "5s"
      # a token with an unknown kid triggers a re-fetch, at most this often
      jwks_min_refetch_interval = "5s"
      # how long the last fetched keys stay in use while the endpoint is
      # unreachable (at least 5m)
      jwks_stale_key_retention  = "5m"
      # optional: attest only instances of these projects
      allowed_project_ids       = ["a1b2", "e5f6"]
      # tolerated clock difference with the issuer (at most 60s); a token is
      # accepted for at most 5m + 2 × this tolerance
      clock_skew_tolerance      = "30s"
    }
  }
}
