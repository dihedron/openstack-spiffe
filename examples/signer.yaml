# openstack-spire-issuer signer replica ("service start --config signer.yaml").
# Values shown are the defaults unless marked otherwise; check the file with
#   openstack-spire-issuer config check --signer signer.yaml --aggregator aggregator.yaml
# The service's own OpenStack credentials are NOT in this file: they come from
# the OS_* environment variables (see signer.env).

listen_addr: "0.0.0.0:8443"
tls_cert_path: "/etc/openstack-spire-issuer/tls.crt"     # required
tls_key_path: "/etc/openstack-spire-issuer/tls.key"      # required, mode 0600, owned by openstack-spire-issuer
tls_min_version: "1.3"                                   # or "1.2": server and OpenStack connections
replica_id: "signer-a"                                   # unique per replica; default: first label of the hostname

key_store:
  backend: "ephemeral_memory"                            # "vault_transit" is not supported yet
  algorithm: "RS256"                                     # or "ES256"
  rotation_interval: "24h"                               # at least 5m
  publish_ahead: "2m"                                    # > poll_interval + fetch_timeout + cache_max_age of peers and aggregator

token_ttl_seconds: 300                                   # at most 300
rate_limit_per_instance: "1/5s"
rate_limit_per_source: "200/1s"
max_body_bytes: 262144

# Restrictions on /attest (S-3): either one confines stolen vendordata
# credentials to the hosts running nova-api-metadata; together they also
# require the client key. The JWKS and health endpoints are not restricted.
attest:
  allowed_sources: ["10.0.20.0/24"]                      # example: the nova-api-metadata hosts; default: any
  client_ca_path: "/etc/openstack-spire-issuer/nova-client-ca.pem"  # example: require Nova's client certificate (see nova.conf)

# client_address:                                        # only behind a proxy/LB that hides client addresses
#   trusted_proxies: ["10.0.10.0/24"]
#   header: "X-Forwarded-For"

custom_claims:                                           # example; default: none; at most 2048 bytes as JSON
  region: "eu-south-1"

tags:
  allowlist: ["role", "env"]                             # example; empty: every string metadata entry

keystone:
  # required: the ID of a dedicated Keystone user for Nova's
  # [vendordata_dynamic_auth] (openstack user show nova-vendordata -f value -c id),
  # never Nova's own service user, whose credentials are on every compute node.
  # name@domain also works, but names can be reused: config check warns.
  allowed_users: ["3f2a9c1e5b7d4a8e9f0c1b2a3d4e5f60"]
  required_role: "service"
  validation_cache_ttl: "60s"
  project_cache_ttl: "10m"
  # ca_cert_path: "/etc/ssl/openstack-ca.pem"            # CA bundle for Keystone and Nova; default: system roots

nova_lookup:
  enabled: true
  cache_ttl: "60s"                                       # at most the token TTL
  allowed_statuses: ["ACTIVE", "BUILD", "REBOOT", "HARD_REBOOT", "REBUILD", "RESIZE", "VERIFY_RESIZE", "MIGRATING", "PASSWORD"]

enrich: ["availability_zone", "project_name"]            # example; default: none

# Audit records (token_issued, key_lifecycle) always appear in the regular log,
# whatever OPENSTACK_SPIRE_ISSUER_LOG_LEVEL says. The syslog audit sink also
# sends them to the local syslog daemon, which can forward them to a central,
# append-only store. Under systemd, journald provides /dev/log.
audit:
  syslog:
    enabled: true                                        # default: false (config check warns)
    socket: "/dev/log"                                   # Unix datagram socket; service start fails if it cannot be opened
    facility: "authpriv"                                 # auth, authpriv, daemon, local0..local7
    app_name: "openstack-spire-issuer"                   # the syslog tag: 1 to 48 printable ASCII characters

# Peer aggregation: with peers, this replica also serves its peers' keys merged
# with its own on /.well-known/jwks.json, so that every replica is a JWKS
# aggregator for the SPIRE Server and no separate aggregator is needed. List
# every other replica (this one may be listed too, so that all replicas share
# the same list), always at /jwks/local.json, never at /.well-known/jwks.json.
peers:                                                   # example; default: none (no peer aggregation)
  urls:                                                  # https only
    - "https://signer-b.internal:8443/jwks/local.json"
    - "https://signer-c.internal:8443/jwks/local.json"
  ca_cert_path: "/etc/ssl/signer-ca.pem"                 # CA bundle for the peers; without it, every public CA is trusted
  poll_interval: "30s"
  fetch_timeout: "5s"                                    # < poll_interval
  stale_key_retention: "5m"                              # at least 5m
  cache_max_age: "30s"                                   # whole seconds: Cache-Control of the merged set
