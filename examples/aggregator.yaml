# openstack-spire-issuer JWKS aggregator ("jwks aggregate --config aggregator.yaml").
# Values shown are the defaults unless marked otherwise.

listen_addr: "0.0.0.0:8444"
tls_cert_path: "/etc/openstack-spire-issuer/aggregator-tls.crt" # required; the certificate SPIRE Server pins
tls_key_path: "/etc/openstack-spire-issuer/aggregator-tls.key" # required, mode 0600, owned by openstack-spire-issuer
tls_min_version: "1.3"                                   # or "1.2": server and replica connections

# Optional: with peers configured (see signer.yaml), the signer replicas serve
# the merged set themselves and no aggregator is needed.

replicas:                                                # required, https only: each signer replica's own keys
  - "https://signer-a.internal:8443/jwks/local.json"
  - "https://signer-b.internal:8443/jwks/local.json"
replica_ca_cert_path: "/etc/ssl/signer-ca.pem"           # CA bundle for the replicas; without it, every public CA is trusted

poll_interval: "30s"
fetch_timeout: "5s"                                      # < poll_interval
stale_key_retention: "5m"                                # at least 5m
cache_max_age: "30s"                                     # whole seconds
rate_limit_per_source: "50/1s"                           # every endpoint (D-5)

# client_address:                                        # only behind a proxy/LB that hides client addresses
#   trusted_proxies: ["10.0.10.0/24"]
#   header: "X-Forwarded-For"
