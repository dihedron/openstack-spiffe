# openstack-spire-vendordata JWKS aggregator ("jwks aggregate --config aggregator.yaml").
# Values shown are the defaults unless marked otherwise.

listen_addr: "0.0.0.0:8444"
tls_cert_path: "/etc/jwks-aggregator/tls.crt"            # required; the certificate SPIRE Server pins
tls_key_path: "/etc/jwks-aggregator/tls.key"             # required, mode 0600
tls_min_version: "1.3"                                   # or "1.2": server and replica connections

replicas:                                                # required, https only: one URL per signer replica
  - "https://signer-a.internal:8443/.well-known/jwks.json"
  - "https://signer-b.internal:8443/.well-known/jwks.json"
# replica_ca_cert_path: "/etc/ssl/signer-ca.pem"         # CA bundle for the replicas; default: system roots

poll_interval: "30s"
fetch_timeout: "5s"                                      # < poll_interval
stale_key_retention: "5m"                                # at least 5m
cache_max_age: "30s"                                     # whole seconds
