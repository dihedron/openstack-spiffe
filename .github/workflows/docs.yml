name: Documents

# Builds the release documents (Setup Guide, Architecture and Design,
# Operator's Guide) on every change that can affect them, so that a document
# that does not build is caught before a release, and attaches the PDFs to
# the run for review. Releases build them again, with the release version
# (make release). See .specs/openstack-spire-docs.md.

on:
  push:
    paths:
      - "docs/**"
      - "examples/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "examples/**"
      - ".github/workflows/docs.yml"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  documents:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # git describe stamps the version

      - name: Build the documents
        run: docs/build.sh

      - name: Attach the documents to the run
        uses: actions/upload-artifact@v4
        with:
          name: documents
          path: build/docs/*.pdf
          if-no-files-found: error
