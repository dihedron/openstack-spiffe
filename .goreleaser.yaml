# one archive per application
archives:
  - id: openstack-spire-metadata
    ids:
      - openstack-spire-metadata
    formats:
      - tar.gz
    name_template: >-
      openstack-spire-metadata_
      {{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}{{ .Arm }}{{ end }}
      {{- if .Amd64 }}{{ .Amd64 }}{{ end }}
    format_overrides:
      - goos: windows
        formats:
          - zip
  - id: openstack-server-plugin
    ids:
      - openstack-server-plugin
    formats:
      - tar.gz
    name_template: >-
      openstack-server-plugin_
      {{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}{{ .Arm }}{{ end }}
      {{- if .Amd64 }}{{ .Amd64 }}{{ end }}
    format_overrides:
      - goos: windows
        formats:
          - zip
  - id: openstack-agent-plugin
    ids:
      - openstack-agent-plugin
    formats:
      - tar.gz
    name_template: >-
      openstack-agent-plugin_
      {{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}{{ .Arm }}{{ end }}
      {{- if .Amd64 }}{{ .Amd64 }}{{ end }}
    format_overrides:
      - goos: windows
        formats:
          - zip

upx:
  - # Whether to enable it or not.
    #
    # Templates: allowed.
    enabled: false

    # Filter by build ID.
    ids: [openstack-spire-metadata, openstack-agent-plugin, openstack-server-plugin]

    # Filter by GOOS.
    goos: [linux, windows]

    # Filter by GOARCH.
    goarch: [amd64, arm64]

    # Filter by GOAMD64.
    goamd64: [v1, v2, v3]

    # Compress argument.
    # Valid options are from '1' (faster) to '9' (better), and 'best'.
    compress: "9"

    # Whether to try LZMA (slower).
    lzma: true

    # Whether to try all methods and filters (slow).
    #brute: true

# one system package per application, each installing only its own binary
# (and, for the OpenStack metadata JWT issuer, its sample configurations)
nfpms:
  - id: openstack-spire-metadata
    package_name: openstack-spire-metadata
    ids:
      - openstack-spire-metadata
    description: |
      Instance identity token issuer for SPIFFE on OpenStack: a Nova
      DynamicJSON vendordata target minting short-lived signed JWTs that
      prove an instance's project and ID, and the JWKS aggregator serving
      their verification keys to SPIRE Server.
    homepage: "https://github.com/dihedron/openstack-spiffe"
    maintainer: "Andrea Funtò <dihedron.dev@gmail.com>"
    vendor: "Andrea Funtò"
    license: "AGPL-3.0"
    formats:
      - rpm
      - deb
      - apk
    epoch: "1"
    release: "1"
    section: default
    priority: "optional"
    contents:
      - src: ./examples/signer.yaml
        dst: /etc/openstack-spire-metadata/signer.yaml
        type: config|noreplace
      - src: ./examples/aggregator.yaml
        dst: /etc/openstack-spire-metadata/aggregator.yaml
        type: config|noreplace
  - id: openstack-server-plugin
    package_name: openstack-server-plugin
    ids:
      - openstack-server-plugin
    description: |
      SPIRE Server node attestor plugin (openstack_iid) verifying the
      instance identity tokens issued by openstack-spire-metadata.
    homepage: "https://github.com/dihedron/openstack-spiffe"
    maintainer: "Andrea Funtò <dihedron.dev@gmail.com>"
    vendor: "Andrea Funtò"
    license: "AGPL-3.0"
    formats:
      - rpm
      - deb
      - apk
    epoch: "1"
    release: "1"
    section: default
    priority: "optional"
    contents:
      - src: ./examples/server.conf
        dst: /usr/share/doc/openstack-server-plugin/server.conf
  - id: openstack-agent-plugin
    package_name: openstack-agent-plugin
    ids:
      - openstack-agent-plugin
    description: |
      SPIRE Agent node attestor plugin (openstack_iid) presenting the
      instance identity token found in the OpenStack vendor data.
    homepage: "https://github.com/dihedron/openstack-spiffe"
    maintainer: "Andrea Funtò <dihedron.dev@gmail.com>"
    vendor: "Andrea Funtò"
    license: "AGPL-3.0"
    formats:
      - rpm
      - deb
      - apk
    epoch: "1"
    release: "1"
    section: default
    priority: "optional"
    contents:
      - src: ./examples/agent.conf
        dst: /usr/share/doc/openstack-agent-plugin/agent.conf

