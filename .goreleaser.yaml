source:
  enabled: true
  # the archive extension is appended by goreleaser
  name_template: "{{ .ProjectName }}_{{ .Version }}_source"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
sboms:
  - cmd: syft
    documents:
      - "${artifact}.spdx.json"
    args: ["$artifact", "--output", "cyclonedx-json=$document", "-vvv"]
    artifacts: package
    disable: false
    
    
release:
  footer: |
    ---
    Released by [GoReleaser](https://github.com/goreleaser/goreleaser).
